name: Deploy static site to GitHub Pages

on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Refresh recent YouTube video pages
        run: python automation/generate_youtube_discovery.py

      - name: Run site and automation tests
        run: python -m unittest discover -s tests -v

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify participating search engines through IndexNow
        run: python automation/submit_indexnow.py
